<script>
  /* 版本自检：服务端的缓存版本号变了就自动重载一次。
     PWA 常驻后台时不刷新会一直跑旧 JS，手机上看到的就还是旧逻辑。
     同一版本只重载一次，不会循环。 */
  (function () {
    try {
      fetch("sw.js", { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var m = t.match(/dingzhu-shell-(v\d+)-/);
          if (!m) return;
          var key = "dingzhu.seenVersion", seen = null;
          try { seen = sessionStorage.getItem(key); } catch (e) {}
          try { sessionStorage.setItem(key, m[1]); } catch (e) {}
          if (seen && seen !== m[1]) location.reload();
        })
        .catch(function () {});
    } catch (e) {}
  })();
</script>
